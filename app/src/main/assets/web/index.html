<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A4A4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rebobina FM">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/rebobina_flechas_favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="./images/rebobina-logo.webp" type="image/webp" fetchpriority="high">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Montserrat:ital,wght@1,800&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Montserrat:ital,wght@1,800&amp;display=swap"></noscript>
  <title>Rebobina FM</title>
  <style>
    #pwa-install-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-width: 36px;
      height: 36px;
      padding: 0 20px;
      border: 0;
      border-radius: 9999px;
      background: #FFB627;
      color: #000;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 4px 4px 0 #000;
      cursor: pointer;
    }

    #pwa-install-button:hover {
      transform: translateY(1px);
      box-shadow: 3px 3px 0 #000;
    }

    #pwa-install-button:active {
      transform: translateY(2px);
      box-shadow: 2px 2px 0 #000;
    }

    #pwa-install-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    @media (max-width: 480px) {
      #pwa-install-button {
        min-width: 36px;
        padding: 0 10px;
        font-size: 11px;
      }
    }

    #player {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 76px;
      padding: 10px max(16px, calc((100vw - 1280px) / 2));
      background: #0A4A4A;
      color: #EBE6AE;
      font-family: "Fredoka", system-ui, sans-serif;
    }

    #radio-stream {
      display: none;
    }

    #player-art {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border-radius: 8px;
      background: #123e3e;
      object-fit: cover;
    }

    #player-info {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      line-height: 1.2;
    }

    #player-title,
    #player-artist {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #player-title {
      color: #EBE6AE;
      font-size: 15px;
      font-weight: 700;
    }

    #player-artist {
      margin-top: 3px;
      color: rgb(235 230 174 / 75%);
      font-size: 12px;
      font-weight: 500;
    }

    #player-status {
      min-height: 14px;
      margin-top: 3px;
      color: rgb(235 230 174 / 65%);
      font-size: 10px;
    }

    #player-toggle {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #FFB627;
      color: #000;
      font: 700 18px "Fredoka", system-ui, sans-serif;
      cursor: pointer;
    }

    #player-toggle svg {
      display: block;
      width: 22px;
      height: 22px;
      overflow: visible;
    }

    #player-volume-control {
      display: flex;
      flex: 0 0 104px;
      align-items: center;
      gap: 6px;
    }

    #player-volume {
      width: 72px;
      height: 24px;
      accent-color: #FFB627;
      cursor: pointer;
    }

    #player-volume-level {
      width: 26px;
      color: rgb(235 230 174 / 75%);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    #player-toggle:focus-visible {
      outline: 2px solid #EBE6AE;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      #player {
        min-height: 68px;
        gap: 9px;
        padding: 8px 12px;
      }

      #player-art {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }

      #player-title {
        font-size: 14px;
      }

      #player-artist {
        font-size: 11px;
      }

      #player-volume-control {
        flex-basis: 76px;
        gap: 4px;
      }

      #player-volume {
        width: 48px;
      }

      #player-volume-level {
        width: 24px;
        font-size: 9px;
      }
    }
  </style>
